name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel older runs on the same branch when new commits land.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test-build:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    # Dummy production-shaped env-vars so `next build` can compile without
    # contacting a real database. None of these reach a network — Prisma
    # only reads DATABASE_URL at query time, and the session secret is
    # only consumed by cookie sign/verify at request time.
    env:
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      RENDER2REAL_SESSION_SECRET: ci-build-deterministic-secret-32-chars-min-aa
      RENDER2REAL_STORAGE_ROOT: ./storage

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Required so that GenerationLogStatus and ImageVersionType — which the
      # services and tests import — are present in @prisma/client before any
      # other step runs.
      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npx vitest run

      # Catches the "compiles locally but breaks in production build" class
      # of bug (the storage-subsystem regression that hit Sprint 1 would
      # have been caught here if this step had existed).
      - name: Production build
        run: npm run build
